# Download Bolt + LiLiCorr drafter into gx10-1ff3 HF host cache.
apiVersion: batch/v1
kind: Job
metadata:
  name: dl-nemotron35-bolt
  namespace: dynamo-qwen
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 7200
  template:
    spec:
      nodeSelector:
        kubernetes.io/hostname: gx10-1ff3
      restartPolicy: Never
      containers:
        - name: dl
          image: python:3.12-slim
          envFrom:
            - secretRef:
                name: hf-token-secret
          env:
            - name: HF_HOME
              value: /model-cache
          volumeMounts:
            - name: model-cache
              mountPath: /model-cache
          command:
            - bash
            - -lc
            - |
              set -euo pipefail
              pip install -q 'huggingface_hub>=0.26'
              python3 <<'PY'
              from huggingface_hub import snapshot_download
              repos = [
                  "nvidia/NVIDIA-Nemotron-3.5-Bolt-74B-A9B-24GB",
                  "nvidia/NVIDIA-Nemotron-3.5-Bolt-74B-A9B-24GB-LiLiCorr",
              ]
              for repo in repos:
                  p = snapshot_download(repo, cache_dir="/model-cache/hub")
                  print("ok", repo, p)
              PY
      volumes:
        - name: model-cache
          hostPath:
            path: /home/dav1/.cache/huggingface
            type: Directory