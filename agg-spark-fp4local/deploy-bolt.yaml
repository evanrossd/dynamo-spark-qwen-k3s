# Spark (2x GB10) — Nemotron 3.5 Bolt 74B-A9B 24GB + Dynamo 1.6 aggregated vLLM.
# Weights + LiLiCorr drafter on gx10-1ff3 hostPath HF cache; eugr/spark-vllm per DGX Spark playbook.
apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: nemotron35-bolt-spark
  namespace: dynamo-qwen
spec:
  backendFramework: vllm
  env:
    - name: HF_HOME
      value: /model-cache
    - name: HF_HUB_OFFLINE
      value: "1"
    - name: TRANSFORMERS_OFFLINE
      value: "1"
    - name: VLLM_WORKER_MULTIPROC_METHOD
      value: spawn
    - name: PYTHONUNBUFFERED
      value: "1"
  components:
    - name: Frontend
      type: frontend
      replicas: 1
      runtimeVersionOverride: "1.6.0"
      podTemplate:
        spec:
          nodeSelector:
            kubernetes.io/hostname: gx10-1be4
          containers:
            - name: main
              image: eugr/spark-vllm:nightly-20261016
              imagePullPolicy: IfNotPresent
              command: ["/bin/bash", "-lc"]
              args:
                - |
                  set -euo pipefail
                  if ! python3 -c "import dynamo.frontend" 2>/dev/null; then
                    pip install --no-cache-dir --no-deps 'ai-dynamo==1.6.0' 'ai-dynamo-runtime==1.6.0'
                    pip install --no-cache-dir 'protobuf>=6.30.2,<7' 'kubernetes>=32,<33' 'transformers>=4.56' \
                      'redis>=6.2,<9' 'zstandard>=0.23,<1'
                  fi
                  exec python3 -m dynamo.frontend --http-host 0.0.0.0 --http-port 8000
              ports:
                - containerPort: 8000
    - name: worker
      type: worker
      replicas: 1
      runtimeVersionOverride: "1.6.0"
      sharedMemorySize: 16Gi
      podTemplate:
        spec:
          nodeSelector:
            kubernetes.io/hostname: gx10-1ff3
          containers:
            - name: main
              env:
                - name: HF_MODULES_CACHE
                  value: /tmp/hf_modules
                - name: VLLM_CONFIG_ROOT
                  value: /tmp/vllm-config
                - name: VLLM_CACHE_ROOT
                  value: /tmp/vllm-cache
              image: eugr/spark-vllm:nightly-20261016
              imagePullPolicy: IfNotPresent
              command: ["/bin/bash", "-lc"]
              args:
                - |
                  set -euo pipefail
                  if ! python3 -c "import dynamo.vllm" 2>/dev/null; then
                    pip install --no-cache-dir --no-deps 'ai-dynamo==1.6.0' 'ai-dynamo-runtime==1.6.0'
                    pip install --no-cache-dir 'protobuf>=6.30.2,<7' 'kubernetes>=32,<33' 'transformers>=4.56' \
                      'redis>=6.2,<9' 'zstandard>=0.23,<1'
                  fi
                  python3 - <<'PY'
                  import site, pathlib
                  d = pathlib.Path(site.getsitepackages()[0])
                  (d / "dynamo_zmq_fix.py").write_text(
                      "import vllm.v1.engine.utils as eu\n"
                      "if not hasattr(eu, 'get_engine_zmq_addresses'):\n"
                      "    eu.get_engine_zmq_addresses = eu.get_engine_zmq_bind_addresses\n"
                  )
                  (d / "dynamo_zmq_fix.pth").write_text("import dynamo_zmq_fix\n")
                  PY
                  export SPECULATIVE_CONFIG='{"method":"dflash","model":"nvidia/NVIDIA-Nemotron-3.5-Bolt-74B-A9B-24GB-LiLiCorr","num_speculative_tokens":7,"rejection_sample_method":"standard"}'
                  exec python3 -m dynamo.vllm \
                    --model nvidia/NVIDIA-Nemotron-3.5-Bolt-74B-A9B-24GB \
                    --served-model-name nvidia/NVIDIA-Nemotron-3.5-Bolt-74B-A9B-24GB \
                    --trust-remote-code \
                    --tensor-parallel-size 1 \
                    --load-format instanttensor \
                    --kv-cache-dtype fp8 \
                    --max-model-len 32768 \
                    --max-num-seqs 8 \
                    --max-num-batched-tokens 4096 \
                    --gpu-memory-utilization 0.8 \
                    --dyn-tool-call-parser qwen3_coder \
                    --dyn-reasoning-parser nemotron_v3 \
                    --reasoning-parser nemotron_v3 \
                    --disaggregation-mode agg \
                    --enable-mamba-shared-prefix-checkpoint \
                    --block-size 64 \
                    --prefix-match-unit 64 \
                    --speculative-config "$SPECULATIVE_CONFIG"
              resources:
                limits:
                  nvidia.com/gpu: "1"
                requests:
                  nvidia.com/gpu: "1"
                  memory: 80Gi
              securityContext:
                capabilities:
                  add: [IPC_LOCK]
              volumeMounts:
                - { name: model-cache, mountPath: /model-cache }
                - name: hf-modules
                  mountPath: /tmp/hf_modules
                - { name: vllm-cache, mountPath: /root/.cache/vllm }
                - { name: flashinfer-cache, mountPath: /root/.cache/flashinfer }
                - { name: triton-cache, mountPath: /root/.triton }
                - { name: dshm, mountPath: /dev/shm }
              startupProbe:
                httpGet:
                  path: /live
                  port: 9090
                periodSeconds: 30
                timeoutSeconds: 20
                failureThreshold: 120
          volumes:
            - name: model-cache
              hostPath:
                path: /home/dav1/.cache/huggingface
                type: Directory
            - name: vllm-cache
              hostPath:
                path: /home/dav1/.cache/vllm
                type: DirectoryOrCreate
            - name: flashinfer-cache
              hostPath:
                path: /home/dav1/.cache/flashinfer
                type: DirectoryOrCreate
            - name: triton-cache
              hostPath:
                path: /home/dav1/.triton
                type: DirectoryOrCreate
            - name: dshm
              emptyDir:
                medium: Memory
                sizeLimit: 16Gi
            - name: hf-modules
              emptyDir: {}